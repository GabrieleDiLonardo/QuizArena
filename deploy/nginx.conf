# Punto di ingresso unico: distribuisce richieste HTTP e WebSocket sui Tomcat.
# Il login e' in un cookie firmato verificabile da ogni Tomcat, quindi non
# servono sticky session; un Tomcat che non risponde viene escluso per
# fail_timeout e la richiesta viene ritentata sul successivo.

upstream quizarena_web {
    server vm1:8080 max_fails=1 fail_timeout=10s;
    server vm2:8080 max_fails=1 fail_timeout=10s;
    server vm3:8080 max_fails=1 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location = / {
        return 302 /quizarena/;
    }

    location / {
        proxy_pass http://quizarena_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 1h;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
