# Tre "VM" QuizArena (nodo Erlang + Tomcat) e Nginx come ingresso unico.
#   docker compose -f deploy/docker-compose.yml up --build
#   http://localhost:8080/

# L'immagine e' costruita una sola volta (servizio vm1) e riusata dagli altri.
x-vm: &vm
  image: quizarena-vm
  environment:
    QUIZARENA_CLUSTER_NODES: quizarena@vm1,quizarena@vm2,quizarena@vm3
    ERLANG_COOKIE: quizarena_demo_cookie
    QUIZARENA_AUTH_SECRET: quizarena-demo-secret-change-me
  restart: "no"

services:
  vm1:
    <<: *vm
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    hostname: vm1
    volumes: [vm1-data:/opt/quizarena/data]
  vm2:
    <<: *vm
    hostname: vm2
    volumes: [vm2-data:/opt/quizarena/data]
  vm3:
    <<: *vm
    hostname: vm3
    volumes: [vm3-data:/opt/quizarena/data]
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [vm1, vm2, vm3]

volumes:
  vm1-data:
  vm2-data:
  vm3-data:
