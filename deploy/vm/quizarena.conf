# /etc/nginx/sites-available/quizarena.conf (solo sulla VM con Nginx)
# Stessa configurazione di deploy/nginx.conf, con gli IP delle VM reali.

upstream quizarena_web {
    least_conn;
    server 10.2.1.3:8080 max_fails=1 fail_timeout=10s;
    server 10.2.1.4:8080 max_fails=1 fail_timeout=10s;
    server 10.2.1.5:8080 max_fails=1 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    absolute_redirect off;

    location = / {
        return 302 /quizarena/;
    }

    location / {
        proxy_pass http://quizarena_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 1h;
        proxy_next_upstream error timeout http_502 http_503;

        # Tomcat che ha servito la risposta: usato da lb-test.sh e
        # visibile dal browser (strumenti sviluppatore -> Rete).
        add_header X-Upstream $upstream_addr always;
    }
}
