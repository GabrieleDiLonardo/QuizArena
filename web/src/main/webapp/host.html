<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Host - QuizArena</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/host.css">
</head>
<body>
    <div class="container">
        <header class="page-topbar">
            <a href="index.html" class="btn-back">← Home</a>
            <span class="user-badge" data-user-badge>
                👤 <span class="user-name" data-current-user>…</span>
            </span>
        </header>

        <h1>Host</h1>

        <div id="step1">
            <h2>1. Scegli un quiz</h2>

            <div class="visibility-picker">
                <span class="visibility-label">Visibilità della stanza:</span>
                <button type="button" id="visibilityToggle"
                        data-visibility="public"
                        class="visibility-button">
                    Pubblica
                </button>
                <span class="visibility-hint" id="visibilityHint">
                    Visibile nella lobby
                </span>
            </div>

            <h3>I miei quiz</h3>
            <div id="myQuizList">Caricamento...</div>

            <details class="public-quizzes-details">
                <summary>Quiz pubblici di altri utenti</summary>
                <div id="publicQuizList">Caricamento...</div>
            </details>
        </div>

        <div id="step2" style="display:none">
            <h2>2. Stanza creata</h2>
            <p>PIN da comunicare ai giocatori:</p>
            <div class="pin" id="pinDisplay"></div>
            <p id="visibilityInfo"></p>
            <h3>Giocatori in attesa</h3>
            <ul id="playerList"></ul>
            <button id="startBtn" disabled>Avvia partita</button>
            <button type="button" class="cancel-room-btn btn-danger">Annulla stanza</button>
        </div>

        <div id="step3" style="display:none">
            <h2>3. Partita in corso</h2>
            <div id="roundInfo"></div>
            <div id="questionText" style="font-size: 18px; margin: 10px 0;"></div>
            <p id="correctAnswer" style="color: #4b3f99;"></p>
            <h3>Classifica</h3>
            <ol id="leaderboard"></ol>
            <button id="nextBtn" style="display:none">Prossimo round</button>
            <button id="endBtn">Termina partita</button>
            <button type="button" class="cancel-room-btn btn-danger">Annulla stanza</button>
        </div>

        <div id="log" class="log"></div>
    </div>
    <script src="js/user-info.js"></script>
    <script src="js/ws-client.js"></script>
    <script src="js/host.js"></script>
</body>
</html>
