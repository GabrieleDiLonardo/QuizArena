<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>QuizArena</title>
    <link rel="stylesheet" href="css/common.css?v=2">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="container">
        <header class="page-topbar">
            <span class="user-badge" data-user-badge hidden>
                👤 <span class="user-name" data-current-user>…</span>
            </span>
        </header>

        <h1>QuizArena</h1>
        <p>Piattaforma distribuita di quiz in tempo reale.</p>

        <div class="menu">
            <a href="login" class="btn" data-guest-only hidden>Accedi</a>
            <a href="register" class="btn" data-guest-only hidden>Registrati</a>
            <a href="lobby.html" class="btn" data-authenticated-only hidden>Lobby (partite aperte)</a>
            <a href="host.html" class="btn" data-authenticated-only hidden>Crea una partita (Host)</a>
            <a href="play.html" class="btn" data-authenticated-only hidden>Gioca (Player)</a>
            <a href="authoring.html" class="btn" data-authenticated-only hidden>I miei quiz</a>
            <a href="history" class="btn" data-authenticated-only hidden>Storico partite</a>
            <form action="logout" method="post" data-authenticated-only hidden>
                <button type="submit" class="btn">Logout</button>
            </form>
        </div>
    </div>
    <script src="js/user-info.js"></script>
</body>
</html>
